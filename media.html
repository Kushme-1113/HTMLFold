<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Multimedia Tags</title>
</head>
<body>
    <a href="index.html">&larr; Back to Home</a>
    <hr>

    <h1>HTML Multimedia Tags</h1>

    <h2>1. Image Tag</h2>
    <img src="https://via.placeholder.com/250" alt="Placeholder Sample Image" title="Sample Image">

    <h2>2. Audio Tag</h2>
    <audio controls>
        <source src="sample-audio.mp3" type="audio/mpeg">
        Aapka browser audio tag support nahi karta.
    </audio>

    <h2>3. Video Tag</h2>
    <video width="320" height="240" controls>
        <source src="sample-video.mp4" type="video/mp4">
        Aapka browser video tag support nahi karta.
    </video>

    <h2>4. Iframe (Embedding another website or map)</h2>
    <iframe src="https://www.wikipedia.org" width="400" height="200" title="Wikipedia Frame"></iframe>
</body>
</html>
