<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Forms</title>
</head>
<body>
    <a href="index.html">&larr; Back to Home</a>
    <hr>

    <h1>Comprehensive HTML Form</h1>

    <form action="#" method="POST">
        
        <!-- Text Field -->
        <label for="fullname">Full Name:</label><br>
        <input type="text" id="fullname" name="fullname" placeholder="Apna naam likhiye" required><br><br>

        <!-- Email Field -->
        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" placeholder="abc@gmail.com" required><br><br>

        <!-- Password Field -->
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <!-- Number Field -->
        <label for="age">Age:</label><br>
        <input type="number" id="age" name="age" min="1" max="100"><br><br>

        <!-- Radio Buttons -->
        <label>Gender:</label><br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br><br>

        <!-- Checkboxes -->
        <label>Skills Known:</label><br>
        <input type="checkbox" id="html" name="skills" value="HTML">
        <label for="html">HTML</label>
        <input type="checkbox" id="python" name="skills" value="Python">
        <label for="python">Python</label><br><br>

        <!-- Date Picker -->
        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob"><br><br>

        <!-- Dropdown Select -->
        <label for="stream">Select Stream:</label><br>
        <select id="stream" name="stream">
            <option value="biotech">Biotechnology</option>
            <option value="cs">Computer Science</option>
            <option value="other">Other</option>
        </select><br><br>

        <!-- File Upload -->
        <label for="resume">Upload Resume:</label><br>
        <input type="file" id="resume" name="resume"><br><br>

        <!-- Textarea -->
        <label for="bio">Short Bio / Message:</label><br>
        <textarea id="bio" name="bio" rows="4" cols="30" placeholder="Apne baare me kuch likhiye..."></textarea><br><br>

        <!-- Buttons -->
        <button type="submit">Submit Form</button>
        <button type="reset">Reset Form</button>

    </form>
</body>
</html>
