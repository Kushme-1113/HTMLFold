<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Tables</title>
</head>
<body>
    <a href="index.html">&larr; Back to Home</a>
    <hr>

    <h1>HTML Table Example</h1>

    <table border="1" cellpadding="10" cellspacing="0">
        <caption><b>Student Timetable / Marks Record</b></caption>
        <thead>
            <tr>
                <th>Roll No</th>
                <th>Student Name</th>
                <th>Subject</th>
                <th>Marks</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>101</td>
                <td>Kush Kumar</td>
                <td>Biotechnology</td>
                <td>85</td>
            </tr>
            <tr>
                <td>102</td>
                <td>Rahul Sharma</td>
                <td>Computer Science</td>
                <td>90</td>
            </tr>
            <tr>
                <td>103</td>
                <td>Anjali Verma</td>
                <td>Biotechnology</td>
                <td>88</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3" align="right"><b>Average / Total Status:</b></td>
                <td><b>Passed ✅</b></td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
